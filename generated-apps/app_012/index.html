<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>CI/CD Pipeline Monitoring Dashboard</h1>
            <div class="header-controls">
                <button id="refreshBtn" class="btn btn-primary">Refresh</button>
                <button id="autoRefreshBtn" class="btn btn-secondary">Auto Refresh: OFF</button>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon success">✓</div>
                <div class="stat-content">
                    <div class="stat-value" id="successCount">0</div>
                    <div class="stat-label">Success</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon failed">✗</div>
                <div class="stat-content">
                    <div class="stat-value" id="failedCount">0</div>
                    <div class="stat-label">Failed</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon running">⟳</div>
                <div class="stat-content">
                    <div class="stat-value" id="runningCount">0</div>
                    <div class="stat-label">Running</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending">⏳</div>
                <div class="stat-content">
                    <div class="stat-value" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon total">📊</div>
                <div class="stat-content">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Jobs</div>
                </div>
            </div>
        </div>

        <div class="filters-container">
            <div class="filter-group">
                <label for="statusFilter">Filter by Status:</label>
                <select id="statusFilter" class="filter-select">
                    <option value="all">All Status</option>
                    <option value="success">Success</option>
                    <option value="failed">Failed</option>
                    <option value="running">Running</option>
                    <option value="pending">Pending</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search:</label>
                <input type="text" id="searchInput" class="filter-input" placeholder="Search by job name...">
            </div>
            <div class="filter-group">
                <label for="itemsPerPage">Items per page:</label>
                <select id="itemsPerPage" class="filter-select">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table class="jobs-table">
                <thead>
                    <tr>
                        <th>Job ID</th>
                        <th>Job Name</th>
                        <th>Status</th>
                        <th>Pipeline</th>
                        <th>Branch</th>
                        <th>Duration</th>
                        <th>Started</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="jobsTableBody">
                    <!-- Jobs will be inserted here -->
                </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <div class="pagination-info">
                Showing <span id="showingFrom">0</span> - <span id="showingTo">0</span> of <span id="totalFiltered">0</span> jobs
            </div>
            <div class="pagination-controls">
                <button id="firstPageBtn" class="btn btn-pagination">First</button>
                <button id="prevPageBtn" class="btn btn-pagination">Previous</button>
                <span class="page-info">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></span>
                <button id="nextPageBtn" class="btn btn-pagination">Next</button>
                <button id="lastPageBtn" class="btn btn-pagination">Last</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
